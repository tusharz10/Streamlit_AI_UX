name: Production Deploy & Auto-Recovery (HTTPS & Zero-Downtime)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Server (bitacloudinfotech.com)
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy & Zero-Downtime Reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            APP_DIR="$HOME/Streamlit_AI_UX"
            if [ ! -d "$APP_DIR" ]; then
              echo "📥 Cloning repository..."
              git clone https://github.com/tusharz10/Streamlit_AI_UX.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR" || true
            git fetch --all
            git reset --hard origin/main
            git pull origin main
            chmod +x deploy.sh
            bash deploy.sh
